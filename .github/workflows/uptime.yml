name: uptime

on:
  schedule:
    # 每 10 分钟探活一次（GitHub Actions 最小粒度 5 分钟）
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://101.37.14.222/ || echo 000)
          echo "HTTP $code"
          test "$code" = "200"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '站点探活失败';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            if (!issues.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `定时探活失败，请检查 http://101.37.14.222/ （${new Date().toISOString()}）`
              });
            }

      - name: Close issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '站点探活失败';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            for (const i of issues.data.filter(x => x.title === title)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: i.number,
                state: 'closed'
              });
            }
