# 本地开发配置；生产用环境变量覆盖（见 application-prod.yml）
server:
  port: 8080
  # 只监听本机，外部统一走 nginx
  address: 127.0.0.1
  compression:
    enabled: true

spring:
  application:
    name: quiz-backend

  datasource:
    # 生产环境在阿里云 ECS 上连本机 PostgreSQL
    url: ${QUIZ_DB_URL:jdbc:postgresql://127.0.0.1:5432/quiz}
    username: ${QUIZ_DB_USER:quiz_app}
    password: ${QUIZ_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none          # 表结构由既有数据库决定，禁止自动建表
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false

  data:
    redis:
      host: ${QUIZ_REDIS_HOST:127.0.0.1}
      port: ${QUIZ_REDIS_PORT:6379}
      timeout: 2s

  jackson:
    default-property-inclusion: non_null

  # 阿里云邮件推送 SMTP（账号密码走环境变量；未配置时自动转管理员兜底）
  mail:
    host: ${QUIZ_SMTP_HOST:}
    port: ${QUIZ_SMTP_PORT:465}
    username: ${QUIZ_SMTP_USER:}
    password: ${QUIZ_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# 应用自定义配置
quiz:
  jwt:
    secret: ${QUIZ_JWT_SECRET:}      # 生产由环境变量注入，禁止硬编码
    expire-seconds: 604800           # 7 天
  # 站点对外地址，用于拼接重置链接（备案通过后改成正式域名）
  site-url: ${QUIZ_SITE_URL:https://101-37-14-222.sslip.io}
  mail:
    from: ${QUIZ_MAIL_FROM:}         # 发信地址，如 noreply@mail.teacher-wishes.asia
  cors:
    allowed-origins: ${QUIZ_CORS:https://101-37-14-222.sslip.io,https://*.teacher-wishes.asia,http://101.37.14.222,http://localhost:3000}
  ai:
    base-url: ${QUIZ_AI_URL:https://api.deepseek.com}
    key: ${QUIZ_AI_KEY:${DEEPSEEK_API_KEY:}}
    model: ${QUIZ_AI_MODEL:deepseek-chat}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    # 未配置 SMTP 时不要让 /actuator/health 因 mail 一直 DOWN
    mail:
      enabled: ${QUIZ_MAIL_HEALTH:false}

logging:
  level:
    root: INFO
    com.quiz: ${QUIZ_LOG_LEVEL:INFO}
