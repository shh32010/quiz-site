# quiz-site nginx 配置（2026-10-23）
# 443：正式域名 / sslip；80：仅保留本机健康检查，其余全部跳 HTTPS

upstream quiz_app { server 127.0.0.1:3100; }

# ---------- HTTPS（正式域名，备案通过后可用） ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name quiz.teacher-wishes.asia;

    ssl_certificate     /etc/letsencrypt/live/quiz.teacher-wishes.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.teacher-wishes.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/quiz-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    client_max_body_size 5m;

    location /qimg/ {
        alias /opt/quiz-assets/qimg/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/quiz-security-headers.conf;
        access_log off;
    }
    location /_nuxt/ { proxy_pass http://quiz_app; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/quiz-security-headers.conf; }
    location /icons/ { proxy_pass http://quiz_app; add_header Cache-Control "public, max-age=604800"; include /etc/nginx/snippets/quiz-security-headers.conf; }
    include /etc/nginx/snippets/quiz-rate-locations.conf;
    location / { proxy_pass http://quiz_app; include /etc/nginx/snippets/quiz-proxy.conf; }
}

# ---------- HTTP 默认站：本机健康检查，其余跳 HTTPS ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.37.14.222 _;

    # health-check.sh 用 http://127.0.0.1/api/health
    location = /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://quiz_app;
        include /etc/nginx/snippets/quiz-proxy.conf;
    }

    location / {
        return 301 https://101-37-14-222.sslip.io$request_uri;
    }
}

# ---------- HTTPS（sslip.io 当前主入口） ----------
server {
    server_name 101-37-14-222.sslip.io; # managed by Certbot

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    client_max_body_size 5m;

    location /qimg/ {
        alias /opt/quiz-assets/qimg/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/quiz-security-headers.conf;
        access_log off;
    }
    location /_nuxt/ { proxy_pass http://quiz_app; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/quiz-security-headers.conf; }
    location /icons/ { proxy_pass http://quiz_app; add_header Cache-Control "public, max-age=604800"; include /etc/nginx/snippets/quiz-security-headers.conf; }
    include /etc/nginx/snippets/quiz-rate-locations.conf;
    location / { proxy_pass http://quiz_app; include /etc/nginx/snippets/quiz-proxy.conf; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/101-37-14-222.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/101-37-14-222.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    include /etc/nginx/snippets/quiz-security-headers.conf;
}

# ---------- HTTP（sslip.io 跳 HTTPS） ----------
server {
    if ($host = 101-37-14-222.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 ;
    listen [::]:80 ;
    server_name 101-37-14-222.sslip.io;
    return 404; # managed by Certbot
}
