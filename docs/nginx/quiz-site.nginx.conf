# quiz-site nginx 配置（2026-10-20）
# 443：域名（备案通过后启用）；80：IP 默认站 + 内网 API 路由

upstream quiz_app   { server 127.0.0.1:3100; }
upstream quiz_rest  { server 127.0.0.1:3001; }
upstream quiz_auth  { server 127.0.0.1:9999; }

# ---------- HTTPS（域名，备案通过后可用） ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name quiz.teacher-wishes.asia;

    ssl_certificate     /etc/letsencrypt/live/quiz.teacher-wishes.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.teacher-wishes.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    client_max_body_size 5m;

    location /rest/v1/ { proxy_pass http://quiz_rest/; include /etc/nginx/snippets/quiz-proxy.conf; }
    location /auth/v1/ { proxy_pass http://quiz_auth/; include /etc/nginx/snippets/quiz-proxy.conf; }
    location /qimg/ {
        alias /opt/quiz-assets/qimg/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /_nuxt/ { proxy_pass http://quiz_app; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /icons/ { proxy_pass http://quiz_app; add_header Cache-Control "public, max-age=604800"; }
    include /etc/nginx/snippets/quiz-rate-locations.conf;
    location / { proxy_pass http://quiz_app; include /etc/nginx/snippets/quiz-proxy.conf; }
}

# ---------- HTTP（IP 访问 + 内网 API） ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.37.14.222 _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    client_max_body_size 5m;

    location = /login { return 301 https://101-37-14-222.sslip.io$request_uri; }

    location /rest/v1/ { proxy_pass http://quiz_rest/; include /etc/nginx/snippets/quiz-proxy.conf; }
    location /auth/v1/ { proxy_pass http://quiz_auth/; include /etc/nginx/snippets/quiz-proxy.conf; }
    location /qimg/ {
        alias /opt/quiz-assets/qimg/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /_nuxt/ { proxy_pass http://quiz_app; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /icons/ { proxy_pass http://quiz_app; add_header Cache-Control "public, max-age=604800"; }
    include /etc/nginx/snippets/quiz-rate-locations.conf;
    location / { proxy_pass http://quiz_app; include /etc/nginx/snippets/quiz-proxy.conf; }
}

