# 限流区（http 上下文）
# register：注册，10 次/分钟，突发 30
# login：登录，30 次/分钟，突发 30
# ai：AI 接口，30 次/分钟，突发 30
# guest：游客判分，60 次/分钟，突发 60
limit_req_zone $binary_remote_addr zone=quiz_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=quiz_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=quiz_ai:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=quiz_guest:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=quiz_forgot:10m rate=5r/m;
limit_req_status 429;
