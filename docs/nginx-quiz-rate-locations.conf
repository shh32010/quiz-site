# 限流 location（server 上下文，插在 location / 之前）
location = /api/auth/register {
    limit_req zone=quiz_register burst=30 nodelay;
    proxy_pass http://quiz_app;
    include /etc/nginx/snippets/quiz-proxy.conf;
}
location = /api/auth/login {
    limit_req zone=quiz_login burst=30 nodelay;
    proxy_pass http://quiz_app;
    include /etc/nginx/snippets/quiz-proxy.conf;
}
location ^~ /api/ai/ {
    limit_req zone=quiz_ai burst=30 nodelay;
    proxy_pass http://quiz_app;
    include /etc/nginx/snippets/quiz-proxy.conf;
}
location ^~ /api/guest/ {
    limit_req zone=quiz_guest burst=60 nodelay;
    proxy_pass http://quiz_app;
    include /etc/nginx/snippets/quiz-proxy.conf;
}
